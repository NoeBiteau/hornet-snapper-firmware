name: firmware CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  host-build-test:
    name: host build + tests + vector drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libopencv-dev ffmpeg

      - name: Configure
        run: cmake -B build -DHAL_TARGET=host

      - name: Build
        run: cmake --build build --parallel

      - name: Download ONNX model (optional — skips gracefully on 404)
        run: |
          curl -fsSL \
            "https://github.com/NoeBiteau/hornet-snapper-firmware/releases/latest/download/velutina_yolo11s_640.onnx" \
            -o firmware_model.onnx \
            || echo "Model not available in releases; onnx_detector test will be skipped"

      - name: Test
        env:
          HS_MODEL_PATH: ${{ github.workspace }}/firmware_model.onnx
        run: ctest --test-dir build --output-on-failure

      - name: Re-emit vectors and check no drift
        run: |
          ./build/tools/gen_vectors/gen_vectors > /tmp/uart_frame.json
          diff -u shared/proto/vectors/v1/uart_frame.json /tmp/uart_frame.json

      - name: Package vectors artifact
        run: |
          cd shared/proto
          zip -r /tmp/vectors-v1.zip vectors/v1
      - uses: actions/upload-artifact@v4
        with:
          name: vectors-v1
          path: /tmp/vectors-v1.zip

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/vectors-v1.zip
          name: ${{ github.ref_name }}
          body: Golden test vectors for proto schema ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
